version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgis/postgis:15-3.3
    container_name: samudra-sachet-db
    environment:
      POSTGRES_DB: samudra_sachet
      POSTGRES_USER: samudra_user
      POSTGRES_PASSWORD: samudra_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - samudra-network

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: samudra-sachet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - samudra-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: samudra-sachet-backend
    environment:
      - DATABASE_URL=postgresql://samudra_user:samudra_password@postgres:5432/samudra_sachet
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=your-secret-key-change-in-production
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    networks:
      - samudra-network

  # Web Frontend
  web:
    build:
      context: ./frontend/apps/web
      dockerfile: Dockerfile
    container_name: samudra-sachet-web
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
      - NODE_ENV=development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/apps/web:/app
      - /app/node_modules
    networks:
      - samudra-network

  # React Native Metro (for mobile development)
  metro:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: samudra-sachet-metro
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    networks:
      - samudra-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: samudra-sachet-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - backend
    networks:
      - samudra-network

  # Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: samudra-sachet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - samudra-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: samudra-sachet-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - samudra-network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  samudra-network:
    driver: bridge

